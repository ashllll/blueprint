name: gates
on:
  push:
    branches: [main]
  pull_request:

jobs:
  orchestration:
    name: Portable orchestration regressions
    runs-on: node24
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="Authorization: Basic ${auth}" fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install locked runtime dependencies
        working-directory: app
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Check orchestration, waiting, receipts and cache
        run: node app/scripts/orchestration-check.mjs
